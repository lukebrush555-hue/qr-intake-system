<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Your SamplePass Page</title>
    <link rel="stylesheet" href="../templates/samplepass-claim/styles.css" />
    <style>
      .editable { cursor: text; }
      [contenteditable="true"]:focus {
        outline: none;
        background: rgba(181,122,43,0.08);
        border-radius: 8px;
      }
      .replace-image {
        margin-top: 14px;
        display: flex;
        justify-content: center;
      }
      .replace-image label {
        min-height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        border: 1px solid var(--line);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--olive-dark);
        letter-spacing: 0.08em;
        font-size: 0.78rem;
        cursor: pointer;
        background: rgba(255,255,255,0.7);
      }
      .replace-image input { display: none; }
      .social-editor { margin-top: 30px; }
      .social-chip.adding { border-style: dashed; }
      .social-modal {
        position: fixed;
        inset: 0;
        background: rgba(26,30,24,0.28);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .social-modal.active { display: flex; }
      .social-modal-card {
        width: 100%;
        max-width: 340px;
        background: var(--surface);
        border-radius: 22px;
        padding: 24px;
      }
      .social-modal-card h3 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: 1.8rem;
      }
      .social-modal-card input { margin-top: 18px; }
      .launch-button { margin-top: 36px; }
      .launch-link {
        margin-top: 18px;
        text-align: center;
        word-break: break-word;
      }
      .launch-link a { color: var(--olive-dark); }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <section class="phone-frame">
        <section class="screen-state active-state">
          <div class="seal-button">
            <span class="seal-inner">RB</span>
          </div>

          <header class="vendor-header">
            <h1 id="vendor-name" class="vendor-name editable" contenteditable="true">Backyard Blooms</h1>
            <p id="vendor-category" class="vendor-category editable" contenteditable="true">Raw Honey</p>
          </header>

          <div class="product-image-wrap">
            <img id="product-image" class="product-image" src="../assets/images/backyard-blooms-honey.svg" alt="Product image" />
          </div>

          <div class="replace-image">
            <label>
              Replace Image
              <input id="image-upload" type="file" accept="image/*" />
            </label>
          </div>

          <section class="product-copy">
            <h2 id="product-name" class="product-name editable" contenteditable="true">Wildflower Raw Honey</h2>
            <div class="accent-line"></div>
            <p id="product-description" class="product-description editable" contenteditable="true">
              Made locally in small seasonal batches using wildflower nectar gathered throughout the Saucon Valley region.
            </p>
          </section>

          <section class="social-editor">
            <p class="social-heading">Stay Connected</p>
            <div class="social-grid">
              <button class="social-chip adding" data-platform="instagram">+ Instagram</button>
              <button class="social-chip adding" data-platform="facebook">+ Facebook</button>
              <button class="social-chip adding" data-platform="website">+ Website</button>
              <button class="social-chip adding" data-platform="order">+ Order Online</button>
            </div>
          </section>

          <div class="launch-button">
            <button id="launch-page">Launch My Free Sample</button>
          </div>

          <div id="launch-link" class="launch-link"></div>

          <footer class="powered-footer">
            <span class="powered-seal">RB</span>
            <span>Powered by RopeBridge</span>
          </footer>
        </section>
      </section>
    </main>

    <div id="social-modal" class="social-modal">
      <div class="social-modal-card">
        <h3 id="modal-title">Instagram</h3>
        <input id="social-input" type="text" placeholder="username or URL" />
        <button id="save-social" style="margin-top:18px;width:100%;">Save</button>
      </div>
    </div>

    <script>
      const SUPABASE_URL = 'https://chqwqnxxggswbsijxnio.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_KY_sTlKcppTc8dlDZjCqaA_2XV6COmP';
      const STORAGE_BUCKET = 'vendor-page-images';

      const socials = {};
      let activePlatform = null;
      let imageFile = null;
      let imagePreview = '../assets/images/backyard-blooms-honey.svg';
      let existingSlug = null;

      const params = new URLSearchParams(window.location.search);
      existingSlug = params.get('slug');

      const modal = document.getElementById('social-modal');
      const modalTitle = document.getElementById('modal-title');
      const socialInput = document.getElementById('social-input');

      document.querySelectorAll('[data-platform]').forEach((button) => {
        button.addEventListener('click', () => {
          activePlatform = button.dataset.platform;
          modalTitle.textContent = button.textContent.replace('+ ', '');
          socialInput.value = socials[activePlatform] || '';
          modal.classList.add('active');
        });
      });

      document.getElementById('save-social').addEventListener('click', () => {
        socials[activePlatform] = socialInput.value.trim();

        const target = document.querySelector(`[data-platform="${activePlatform}"]`);

        if (socialInput.value.trim()) {
          target.textContent = socialInput.value.trim();
          target.classList.remove('adding');
        }

        modal.classList.remove('active');
      });

      document.getElementById('image-upload').addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;

        imageFile = file;

        const reader = new FileReader();

        reader.onload = (e) => {
          imagePreview = e.target.result;
          document.getElementById('product-image').src = imagePreview;
        };

        reader.readAsDataURL(file);
      });

      function slugify(value) {
        return value
          .toLowerCase()
          .trim()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-|-$/g, '');
      }

      async function uploadImage(slug) {
        if (!imageFile) {
          return imagePreview;
        }

        const extension = imageFile.name.split('.').pop();
        const filePath = `${slug}-${Date.now()}.${extension}`;

        const uploadResponse = await fetch(
          `${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${filePath}`,
          {
            method: 'POST',
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,
              'Content-Type': imageFile.type,
            },
            body: imageFile,
          }
        );

        if (!uploadResponse.ok) {
          throw new Error('Image upload failed');
        }

        return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${filePath}`;
      }

      async function loadExistingPage() {
        if (!existingSlug) return;

        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/vendor_pages?slug=eq.${existingSlug}&select=*`,
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,
            },
          }
        );

        const pages = await response.json();
        const page = pages[0];

        if (!page) return;

        document.getElementById('vendor-name').textContent = page.vendor_name || '';
        document.getElementById('vendor-category').textContent = page.category || '';
        document.getElementById('product-name').textContent = page.product_name || '';
        document.getElementById('product-description').textContent = page.description || '';

        if (page.image_url) {
          imagePreview = page.image_url;
          document.getElementById('product-image').src = page.image_url;
        }

        const socialMap = {
          instagram: page.instagram,
          facebook: page.facebook,
          website: page.website,
          order: page.order_link,
        };

        Object.entries(socialMap).forEach(([platform, value]) => {
          if (!value) return;

          socials[platform] = value;

          const target = document.querySelector(`[data-platform="${platform}"]`);
          target.textContent = value;
          target.classList.remove('adding');
        });

        document.getElementById('launch-page').textContent = 'Save Changes';
      }

      async function pageExists(slug) {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/vendor_pages?slug=eq.${slug}&select=slug`,
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,
            },
          }
        );

        const pages = await response.json();
        return pages.length > 0;
      }

      async function savePage(payload, slug, shouldUpdate) {
        if (shouldUpdate) {
          return fetch(`${SUPABASE_URL}/rest/v1/vendor_pages?slug=eq.${slug}`, {
            method: 'PATCH',
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload),
          });
        }

        return fetch(`${SUPABASE_URL}/rest/v1/vendor_pages`, {
          method: 'POST',
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            Prefer: 'return=minimal',
          },
          body: JSON.stringify(payload),
        });
      }

      document.getElementById('launch-page').addEventListener('click', async () => {
        const launchButton = document.getElementById('launch-page');
        launchButton.disabled = true;
        launchButton.textContent = existingSlug ? 'Saving...' : 'Launching...';

        try {
          const vendorName = document.getElementById('vendor-name').textContent.trim();
          const slug = existingSlug || slugify(vendorName);
          const imageUrl = await uploadImage(slug);
          const shouldUpdate = existingSlug || await pageExists(slug);

          const payload = {
            slug,
            vendor_name: vendorName,
            category: document.getElementById('vendor-category').textContent.trim(),
            product_name: document.getElementById('product-name').textContent.trim(),
            description: document.getElementById('product-description').textContent.trim(),
            image_url: imageUrl,
            cta_text: 'Claim My Free Sample',
            instagram: socials.instagram || null,
            facebook: socials.facebook || null,
            website: socials.website || null,
            order_link: socials.order || null,
          };

          const response = await savePage(payload, slug, shouldUpdate);

          if (!response.ok) {
            throw new Error('Page save failed');
          }

          const liveUrl = `${location.origin}/qr-intake-system/sample/?slug=${slug}`;
          const editUrl = `${location.origin}/qr-intake-system/create/?slug=${slug}`;

          document.getElementById('launch-link').innerHTML = `
            <div><a href="${liveUrl}" target="_blank">Live Page</a></div>
            <div style="margin-top:8px;"><a href="${editUrl}" target="_blank">Edit Page</a></div>
          `;

          existingSlug = slug;
          launchButton.textContent = 'Save Changes';
        } catch (error) {
          console.error(error);
          document.getElementById('launch-link').textContent = 'Something went wrong.';
        } finally {
          launchButton.disabled = false;
        }
      });

      loadExistingPage();
    </script>
  </body>
</html>
