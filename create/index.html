<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Your SamplePass Page</title>
    <link rel="stylesheet" href="../templates/samplepass-claim/styles.css" />
    <style>
      .editable {
        cursor: text;
      }

      [contenteditable="true"]:focus {
        outline: none;
        background: rgba(181, 122, 43, 0.08);
        border-radius: 8px;
      }

      .editor-note {
        margin-top: 10px;
        text-align: center;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .replace-image {
        margin-top: 14px;
        display: flex;
        justify-content: center;
      }

      .replace-image label {
        min-height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        border: 1px solid var(--line);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--olive-dark);
        letter-spacing: 0.08em;
        font-size: 0.78rem;
        cursor: pointer;
        background: rgba(255,255,255,0.7);
      }

      .replace-image input {
        display: none;
      }

      .social-editor {
        margin-top: 30px;
      }

      .social-chip.adding {
        border-style: dashed;
      }

      .social-modal {
        position: fixed;
        inset: 0;
        background: rgba(26, 30, 24, 0.28);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .social-modal.active {
        display: flex;
      }

      .social-modal-card {
        width: 100%;
        max-width: 340px;
        background: var(--surface);
        border-radius: 22px;
        padding: 24px;
      }

      .social-modal-card h3 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: 1.8rem;
      }

      .social-modal-card input {
        margin-top: 18px;
      }

      .launch-button {
        margin-top: 36px;
      }

      .launch-link {
        margin-top: 18px;
        text-align: center;
        word-break: break-word;
      }

      .launch-link a {
        color: var(--olive-dark);
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <section class="phone-frame">
        <section class="screen-state active-state">
          <div class="seal-button" aria-hidden="true">
            <span class="seal-inner">RB</span>
          </div>

          <header class="vendor-header">
            <h1 id="vendor-name" class="vendor-name editable" contenteditable="true">
              Backyard Blooms
            </h1>

            <p id="vendor-category" class="vendor-category editable" contenteditable="true">
              Raw Honey
            </p>
          </header>

          <div class="product-image-wrap">
            <img
              id="product-image"
              class="product-image"
              src="../assets/images/backyard-blooms-honey.svg"
              alt="Product image"
            />
          </div>

          <div class="replace-image">
            <label>
              Replace Image
              <input id="image-upload" type="file" accept="image/*" />
            </label>
          </div>

          <section class="product-copy">
            <h2 id="product-name" class="product-name editable" contenteditable="true">
              Wildflower Raw Honey
            </h2>

            <div class="accent-line"></div>

            <p id="product-description" class="product-description editable" contenteditable="true">
              Made locally in small seasonal batches using wildflower nectar gathered throughout the Saucon Valley region.
            </p>
          </section>

          <section class="social-editor">
            <p class="social-heading">Stay Connected</p>

            <div class="social-grid">
              <button class="social-chip adding" data-platform="instagram">
                + Instagram
              </button>

              <button class="social-chip adding" data-platform="facebook">
                + Facebook
              </button>

              <button class="social-chip adding" data-platform="website">
                + Website
              </button>

              <button class="social-chip adding" data-platform="order">
                + Order Online
              </button>
            </div>
          </section>

          <div class="launch-button">
            <button id="launch-page">Launch My Free Sample</button>
          </div>

          <div id="launch-link" class="launch-link"></div>

          <footer class="powered-footer">
            <span class="powered-seal">RB</span>
            <span>Powered by RopeBridge</span>
          </footer>
        </section>
      </section>
    </main>

    <div id="social-modal" class="social-modal">
      <div class="social-modal-card">
        <h3 id="modal-title">Instagram</h3>
        <input id="social-input" type="text" placeholder="username" />
        <button id="save-social" style="margin-top:18px;width:100%;">Save</button>
      </div>
    </div>

    <script>
      const socials = {};
      let activePlatform = null;

      const modal = document.getElementById('social-modal');
      const modalTitle = document.getElementById('modal-title');
      const socialInput = document.getElementById('social-input');

      document.querySelectorAll('[data-platform]').forEach((button) => {
        button.addEventListener('click', () => {
          activePlatform = button.dataset.platform;
          modalTitle.textContent = button.textContent.replace('+ ', '');
          socialInput.value = socials[activePlatform] || '';
          modal.classList.add('active');
        });
      });

      document.getElementById('save-social').addEventListener('click', () => {
        socials[activePlatform] = socialInput.value.trim();

        const target = document.querySelector(`[data-platform="${activePlatform}"]`);

        if (socialInput.value.trim()) {
          target.textContent = socialInput.value.trim();
          target.classList.remove('adding');
        }

        modal.classList.remove('active');
      });

      document.getElementById('image-upload').addEventListener('change', (event) => {
        const file = event.target.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = (e) => {
          document.getElementById('product-image').src = e.target.result;
        };

        reader.readAsDataURL(file);
      });

      document.getElementById('launch-page').addEventListener('click', () => {
        const params = new URLSearchParams({
          brand: document.getElementById('vendor-name').textContent.trim(),
          category: document.getElementById('vendor-category').textContent.trim(),
          product: document.getElementById('product-name').textContent.trim(),
          description: document.getElementById('product-description').textContent.trim(),
        });

        const url = `${location.origin}/qr-intake-system/templates/samplepass-claim/?${params.toString()}`;

        document.getElementById('launch-link').innerHTML = `<a href="${url}" target="_blank">${url}</a>`;
      });
    </script>
  </body>
</html>
