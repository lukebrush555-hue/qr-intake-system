<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SamplePass</title>
    <link rel="stylesheet" href="../templates/samplepass-claim/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="phone-frame">
        <section class="screen-state active-state">
          <div class="seal-button">
            <span class="seal-inner">RB</span>
          </div>

          <header class="vendor-header">
            <h1 id="vendor-name" class="vendor-name">Loading...</h1>
            <p id="vendor-category" class="vendor-category"></p>
          </header>

          <div class="product-image-wrap">
            <img id="product-image" class="product-image" />
          </div>

          <section class="product-copy">
            <h2 id="product-name" class="product-name"></h2>
            <div class="accent-line"></div>
            <p id="product-description" class="product-description"></p>
          </section>

          <section class="claim-form">
            <button id="cta-button">Claim My Free Sample</button>

            <div class="limit-row">
              <span class="limit-dot"></span>
              <p id="recognition-copy">One claim per person, per day.</p>
            </div>
          </section>

          <section id="social-section" class="social-section"></section>

          <footer class="powered-footer">
            <span class="powered-seal">RB</span>
            <span>Powered by RopeBridge</span>
          </footer>
        </section>
      </section>
    </main>

    <script>
      const SUPABASE_URL = 'https://chqwqnxxggswbsijxnio.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_KY_sTlKcppTc8dlDZjCqaA_2XV6COmP';
      const STORAGE_KEY = 'ropebridge_identity_token';

      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');

      let vendorPage = null;
      let recognizedUser = null;

      function generateToken() {
        return `rb_${crypto.randomUUID()}`;
      }

      async function ensureIdentity() {
        let token = localStorage.getItem(STORAGE_KEY);

        if (!token) {
          token = generateToken();
          localStorage.setItem(STORAGE_KEY, token);

          await fetch(`${SUPABASE_URL}/rest/v1/users`, {
            method: 'POST',
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,
              'Content-Type': 'application/json',
              Prefer: 'return=minimal',
            },
            body: JSON.stringify({
              identity_token: token,
            }),
          });
        }

        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/users?identity_token=eq.${token}&select=*`,
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,
            },
          }
        );

        const users = await response.json();
        recognizedUser = users[0] || null;

        if (recognizedUser) {
          document.getElementById('recognition-copy').textContent = 'Welcome back — your details are already recognized.';
        }
      }

      async function loadPage() {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/vendor_pages?slug=eq.${slug}&select=*`,
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,
            },
          }
        );

        const data = await response.json();
        vendorPage = data[0];

        if (!vendorPage) {
          document.getElementById('vendor-name').textContent = 'Page not found';
          return;
        }

        document.title = `${vendorPage.vendor_name} — SamplePass`;

        document.getElementById('vendor-name').textContent = vendorPage.vendor_name;
        document.getElementById('vendor-category').textContent = vendorPage.category || '';
        document.getElementById('product-name').textContent = vendorPage.product_name;
        document.getElementById('product-description').textContent = vendorPage.description || '';
        document.getElementById('product-image').src = vendorPage.image_url || '../assets/images/backyard-blooms-honey.svg';
        document.getElementById('cta-button').textContent = vendorPage.cta_text || 'Claim My Free Sample';

        const socials = [
          ['Instagram', vendorPage.instagram],
          ['Facebook', vendorPage.facebook],
          ['Website', vendorPage.website],
          ['Order Online', vendorPage.order_link],
        ].filter(([, value]) => value);

        if (socials.length) {
          const section = document.getElementById('social-section');

          section.innerHTML = `
            <p class="social-heading">Stay Connected</p>
            <div class="social-grid">
              ${socials.map(([label, url]) => `
                <a class="social-chip" href="${url}" target="_blank" rel="noreferrer">
                  <span>${label}</span>
                </a>
              `).join('')}
            </div>
          `;
        }
      }

      async function recordInteraction() {
        if (!recognizedUser || !vendorPage) return;

        await fetch(`${SUPABASE_URL}/rest/v1/interactions`, {
          method: 'POST',
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            Prefer: 'return=minimal',
          },
          body: JSON.stringify({
            user_id: recognizedUser.id,
            vendor_page_id: vendorPage.id,
            interaction_type: 'sample_claim',
            metadata: {
              slug,
            },
          }),
        });
      }

      document.getElementById('cta-button').addEventListener('click', async () => {
        document.getElementById('cta-button').textContent = 'Saved';
        await recordInteraction();
      });

      (async function init() {
        await ensureIdentity();
        await loadPage();
      })();
    </script>
  </body>
</html>
